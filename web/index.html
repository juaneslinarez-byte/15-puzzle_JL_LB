<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo reemplaza el argumento --base-href de `flutter build web`
       (en GitHub Pages es /15-puzzle/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rompecabezas deslizante (15-Puzzle) hecho en Flutter. Funciona sin conexión.">
  <meta name="theme-color" content="#1F6F5C">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>15-Puzzle Flutter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fondo mientras carga Flutter, para que no se vea un destello blanco. */
    html, body { margin: 0; background: #F5FBF7; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1512; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Service worker propio (web/sw.js): guarda la app en caché para que
    // funcione sin conexión. El que trae Flutter por defecto se desinstala solo.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
